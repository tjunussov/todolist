<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text] { flex: 1; padding: 8px; font-size: 14px; }
  button { padding: 8px 12px; cursor: pointer; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #eee; }
  li span { flex: 1; }
  li.done span { text-decoration: line-through; color: #999; }
  li button { background: none; border: none; color: #c00; font-size: 16px; }
</style>
</head>
<body>
<div id="app">
  <h1>Todo ({{ remaining }} осталось)</h1>
  <form @submit.prevent="addTask">
    <input type="text" v-model.trim="newText" placeholder="Новая задача...">
    <button type="submit">Добавить</button>
  </form>
  <ul>
    <li v-for="task in tasks" :key="task.id" :class="{ done: task.done }">
      <input type="checkbox" v-model="task.done">
      <span>{{ task.text }}</span>
      <button type="button" @click="removeTask(task.id)">✕</button>
    </li>
  </ul>
</div>

<script>
const { createApp, ref, computed, watch } = Vue;
const STORAGE_KEY = 'tjtodo-1-tasks';

createApp({
  setup() {
    let saved = [];
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch (e) { saved = []; }

    const tasks = ref(saved);
    const newText = ref('');
    const remaining = computed(() => tasks.value.filter(t => !t.done).length);

    watch(tasks, (val) => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(val));
    }, { deep: true });

    const addTask = () => {
      if (!newText.value) return;
      tasks.value.push({ id: Date.now(), text: newText.value, done: false });
      newText.value = '';
    };

    const removeTask = (id) => {
      tasks.value = tasks.value.filter(t => t.id !== id);
    };

    return { tasks, newText, remaining, addTask, removeTask };
  }
}).mount('#app');
</script>
</body>
</html>
